  --urgent:#B3402F; --urgent-soft:#F7E7E3; --amber:#9A6A12; --amber-soft:#F5EDDC;
  --prospect:#59718D; --prospect-soft:#E8EDF4; --neutral:#6B7C78; --neutral-soft:#EDF1F0;

}

  --done:#5FBFAF; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:88px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 6px}
.wordmark{font-weight:800;letter-spacing:.1em;font-size:15px;text-transform:uppercase}
.wordmark small{color:var(--brand);letter-spacing:.1em}
.asof{font-size:11px;color:var(--muted);letter-spacing:.02em}
.plrail{display:flex;gap:8px;padding:6px 0 10px;overflow-x:auto;scrollbar-width:none}
.plrail::-webkit-scrollbar{display:none}
.plchip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted)}
.plchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wkrail{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.wkrail::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;text-align:center;padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.wk b{display:block;font-size:12.5px;color:var(--ink)}
.wk span{font-size:10.5px;letter-spacing:.02em}
.wk[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.wk[aria-pressed="true"] b{color:var(--accent)}
.tabs{display:flex;gap:18px;border-top:1px solid var(--line);padding:8px 0}
.tab{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:2px 0;border-bottom:2px solid transparent}
.tab[aria-pressed="true"]{color:var(--ink);border-color:var(--brand)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.progress{height:6px;border-radius:99px;background:var(--neutral-soft);margin:10px 0 2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s ease}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}

/* banner */
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--ink);font-size:13.5px;border:1px solid var(--line)}
.banner b{color:var(--amber)}

/* day cards */
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.dayhead{width:100%;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px}
.kindstripe{width:4px;align-self:stretch;border-radius:4px;flex:0 0 4px}
.k-fp{background:var(--accent)} .k-rev{background:var(--prospect)} .k-swp{background:var(--amber)} .k-ovl{background:var(--urgent)}
.dayinfo{flex:1;min-width:0}
.dayname{font-weight:750;font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kindtag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.daymeta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayright{text-align:right;flex:0 0 auto}
.dayspine{display:block;font-weight:800;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
.dayspine small{font-weight:600;font-size:10px;letter-spacing:.05em;color:var(--muted);display:block}
.daydone{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.daybody{border-top:1px solid var(--line);display:none}
.day.open .daybody{display:block}
.dayactions{display:flex;gap:8px;padding:10px 14px 4px;flex-wrap:wrap}
.navhint{font-size:11px;color:var(--muted);padding:0 14px 10px;border-bottom:1px solid var(--line);line-height:1.4}
.btn{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:650;font-size:13px;background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}

/* stops */
.stop{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.stop:last-child{border-bottom:none}
.stop.done{opacity:.55}
.check{flex:0 0 30px;height:30px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;margin-top:2px}
.stop.done .check{background:var(--done);border-color:var(--done);color:var(--accent-ink)}
.stopmain{flex:1;min-width:0}
.stopname{font-weight:650;font-size:14.5px;text-align:left;display:block;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.c-protect{background:var(--soft);color:var(--accent)}
.c-lapsed{background:var(--urgent-soft);color:var(--urgent)}
.c-react{background:var(--amber-soft);color:var(--amber)}
.c-convert{background:var(--amber-soft);color:var(--amber)}
.c-prospect{background:var(--prospect-soft);color:var(--prospect)}
.c-cross{background:var(--neutral-soft);color:var(--neutral)}
.stopmeta{font-size:12px;color:var(--muted);margin-top:3px}
.spinebadge{flex:0 0 auto;font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;margin-top:2px}
.spinebadge.zero{color:var(--line)}
.stopdetail{display:none;margin-top:8px;font-size:12.5px}
.stop.open .stopdetail{display:block}
.stopdetail .addr{color:var(--muted);margin-bottom:6px}
.saybox{background:var(--soft);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:8px 10px;margin:6px 0;line-height:1.5}
.saybox b{color:var(--accent);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.provline{margin:6px 0;color:var(--ink)}
.provline b{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.payline{margin:6px 0 8px;font-weight:600}
.pay-caution{color:var(--urgent)} .pay-ok{color:var(--accent)} .pay-mix{color:var(--amber)} .pay-neutral{color:var(--muted)}
.c-pay-wc{background:var(--soft);color:var(--accent)}
.c-pay-com{background:var(--neutral-soft);color:var(--neutral)}
.c-pay-mix{background:var(--amber-soft);color:var(--amber)}
.c-pay-med{background:var(--urgent-soft);color:var(--urgent)}
.stopdetail textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);font:12.5px/1.4 inherit;padding:7px 9px;resize:vertical}
.rowactions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.minibtn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:650}
.minibtn.go{color:var(--accent)}
.minibtn.checkin{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.done .minibtn.checkin{background:var(--surface);color:var(--muted);border-color:var(--line)}

/* radar + money list */
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
.lrow{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border-bottom:none}
.lrank{flex:0 0 26px;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lmain{flex:1;min-width:0}
.lname{font-weight:650;font-size:14px}
.lmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
.lright{flex:0 0 auto;text-align:right}
.lspine{font-weight:800;font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.ldsv{font-size:11px;font-variant-numeric:tabular-nums}
.dsv-bad{color:var(--urgent);font-weight:700}
.dsv-ok{color:var(--muted)}
.sectionhead{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 0}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30}
.footin{max-width:680px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.legal{font-size:10px;color:var(--muted);line-height:1.35;flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13.5px}
</style>

const store = {

(function initWeek(){
  const today = new Date();

})();

const idOf = (day, s) => day.w+"|"+day.d+"|"+s.a;
const acc = i => DATA.accounts[i];
const daysFor = (pl,w) => DATA.days.filter(d=>d.pl===pl && d.w===w);
const esc = t => String(t??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function addrOf(a){ return a.ad || (a.n+", "+a.c+", MI"); }
function mapsSearch(a){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a.n+", "+(a.ad||a.c)); }
// Official Maps URLs API (developers.google.com/maps/documentation/urls):
// origin omitted = current device location; dir_action=navigate = turn-by-turn.
function mapsTrip(day, done){
  const un = day.s.filter(s=>!done[idOf(day,s)]).map(s=>addrOf(acc(s.a))).slice(0,10);
  if(!un.length) return null;
  const dest = un[un.length-1];
  const wps = un.slice(0,-1).slice(0,9);
  let u = "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(dest);
  if(wps.length) u += "&waypoints="+wps.map(encodeURIComponent).join("%7C");
  return u;
}
function mapsNext(day, done){
  const nxt = day.s.find(s=>!done[idOf(day,s)]);
  if(!nxt) return null;
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination="+encodeURIComponent(addrOf(acc(nxt.a)));
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),2200); }

  $$("#wkrail .wk").forEach(b=>b.onclick=()=>{ state.week=+b.dataset.w; render(); });
  const cur = $('#wkrail .wk[aria-pressed="true"]'); if(cur) cur.scrollIntoView({inline:"center",block:"nearest"});
}
$$(".tab").forEach(b=>b.onclick=()=>{ state.view=b.dataset.view; render(); });

function render(){
  renderRails();
  $$(".tab").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.view===state.view)));
  const main=$("#main");
  if(state.view==="week") renderWeek(main);
  else if(state.view==="radar") renderRadar(main);
  else renderMoney(main);
}

      store.set(state.pl,st); toast(day.d+" marked done"); render();
    };
    $$(".stop",el).forEach(srow=>{
      const id=srow.dataset.id;
      $("[data-expand]",srow).onclick=()=>srow.classList.toggle("open");
      $("[data-check]",srow).onclick=()=>{
        const st=store.get(state.pl); st.done=st.done||{};
        if(st.done[id]) delete st.done[id]; else st.done[id]=new Date().toISOString();
        store.set(state.pl,st); render();
      };
      $("[data-note]",srow).onchange=(e)=>{
        const st=store.get(state.pl); st.notes=st.notes||{}; st.notes[id]=e.target.value.slice(0,500);
        store.set(state.pl,st); toast("Note saved");
      };
    });
  });
}

function renderRadar(main){
  const pl=state.pl;
  const seen=new Map();
  DATA.days.filter(d=>d.pl===pl).forEach(d=>d.s.forEach(x=>{
    const a=acc(x.a);
    if(!/Repeat|One Spine/.test(a.b)) return;
    const cur=seen.get(x.a);
    if(!cur || d.w<cur.w) seen.set(x.a,{a, w:d.w, day:d.d});
  }));
  const rows=[...seen.values()].sort((p,q)=>(q.a.sp-p.a.sp)||((q.a.dv||0)-(p.a.dv||0)));
  let html = `<div class="sectionhead">${esc(pl)} — every proven spine referrer (repeat + one-spine), highest yield first</div><div class="listcard">`;
  html += rows.map((r,i)=>{
    const bad = r.a.dv!=null && r.a.dv>28;
    return `<div class="lrow">
      <div class="lrank num">${i+1}</div>
      <div class="lmain"><div class="lname">${esc(r.a.n)}</div>
      <div class="lmeta">${esc(r.a.t)} · ${esc(r.a.c)} · next: <b>W${r.w+1} ${esc(r.day)}</b></div></div>
      <div class="lright"><div class="lspine num">${r.a.sp}</div>
      <div class="ldsv num ${bad?"dsv-bad":"dsv-ok"}">${r.a.dv==null?"—":r.a.dv+"d since visit"}</div></div>
    </div>`;
  }).join("") || `<div class="empty">No proven referrers in this book.</div>`;
  html += `</div>`;
  main.innerHTML = html;
}

function renderMoney(main){
  const w=state.week;
  const best=new Map();
  DATA.days.filter(d=>d.w===w).forEach(d=>d.s.forEach(x=>{
    const a=acc(x.a); const k=d.pl+"|"+a.n;
    if(!best.has(k)) best.set(k,{a,pl:d.pl,day:d.d,r:x.r});
  }));
  const rows=[...best.values()].sort((p,q)=>q.a.sp-p.a.sp).slice(0,12);
  let html = `<div class="sectionhead">W${w+1} (${esc(DATA.weeks[w])}) — the highest-value visits on the whole team's plan</div><div class="listcard">`;
  html += rows.map((r,i)=>`<div class="lrow">
      <div class="lrank num">${i+1}</div>
      <div class="lmain"><div class="lname">${esc(r.a.n)}</div>
      <div class="lmeta">${esc(r.pl)} · ${esc(r.day)} · ${esc(r.a.t)} · ${esc(r.a.c)}</div></div>
      <div class="lright"><div class="lspine num">${r.a.sp}</div><div class="ldsv dsv-ok">spine '26</div></div>
    </div>`).join("");
  html += `</div>`;
  main.innerHTML = html;
}

// ---- export ----
$("#exportBtn").onclick = async ()=>{
  const pl=state.pl, s=store.get(pl), done=s.done||{}, notes=s.notes||{};
  const lines=["week,pl,route_day,account,spine_2026,role,checked_in_at,note"];
  DATA.days.filter(d=>d.pl===pl).forEach(d=>d.s.forEach(x=>{
    const id=idOf(d,x);
    if(!done[id] && !notes[id]) return;
    const a=acc(x.a);
    const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    lines.push([`W${d.w+1}`,pl,q(d.d),q(a.n),a.sp,q(x.r),done[id]||"",q(notes[id]||"")].join(","));
  }));
  if(lines.length===1){ toast("Nothing logged yet"); return; }
  const body=lines.join("\n");
  const fname=`spine-visit-log_${pl}_${new Date().toISOString().slice(0,10)}.txt`;
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:fname,data:body}); toast("Log saved"); }
    catch(e){ if(e && e.code==="declined") toast("Save cancelled"); else if(e && e.code==="rate_limited") toast("Try again in a moment"); else fallbackCopy(body); }
  } else fallbackCopy(body);
};
function fallbackCopy(text){
  try{ navigator.clipboard.writeText(text).then(()=>toast("Log copied — paste into a sheet")); }
  catch(e){ toast("Copy failed — screenshot instead"); }
}

render();
</script>
